syntax = "proto3";

package lite;

option java_package = "demo.lite";
option java_multiple_files = true;
option optimize_for = LITE_RUNTIME;

message LiteUser {
  optional string name = 1;
  repeated string aliases = 2;
  map<string, int32> labels = 3;

  oneof contact {
    string email = 4;
    int64 phone = 5;
  }

  Profile profile = 6;

  message Profile {
    string display_name = 1;
  }
}
