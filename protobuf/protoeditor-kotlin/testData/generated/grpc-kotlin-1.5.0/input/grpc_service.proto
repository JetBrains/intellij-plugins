syntax = "proto3";

package grpcdemo;

option java_package = "demo.grpc";
option java_multiple_files = true;

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
}

service Greeter {
  rpc SayHello(HelloRequest) returns (HelloReply);
  rpc ListReplies(HelloRequest) returns (stream HelloReply);
  rpc CollectReplies(stream HelloRequest) returns (HelloReply);
  rpc Chat(stream HelloRequest) returns (stream HelloReply);
}
