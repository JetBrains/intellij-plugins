baseProfile: "empty"
name: "qodana.recommended"

include:
  - "qodana.pqc.groups.yaml"

groups:
  - groupId: QodanaOpengrepInspections
    groups:
      - "category:OpenGrep"
  - groupId: LuaOpengrepRules
    groups:
      - "category:OpenGrep/Lua"
  - groupId: LuaPluginRules
    inspections:
      - LuaConstantLogicalOperand
      - LuaDuplicateCondition
      - LuaDuplicateTableKey
      - LuaSelfAssignment
      - LuaUnreachableCode
      - LuaUnusedLabel
      - LuaVariableAttribute
      - LuaRecursiveLocal
      - LuaSuspiciousForRange
      - LuaUnusedLocal

inspections:
  - group: QodanaOpengrepInspections
    enabled: true
  - inspection: DartAnalyze
    enabled: true
  - group: AllPqcInspections
    enabled: false
  - group: PqcMinLevel1
    enabled: true
  - group: LuaOpengrepRules
    enabled: true
  - group: LuaPluginRules
    enabled: true
  - group: ALL
    ignore:
      - "vendor/**"
      - "**/node_modules/**"
      - "dist/**"
      - "build/**"
      - "tests/**"
      - "test/**"
      - "spec/**"
      - "scope#$gitignore" # $gitignore scope available only in qodana execution
