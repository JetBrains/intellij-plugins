# Post-Quantum Cryptography inspection groups.
#
# Materializes, as explicit inspection ids, the grouping that used to be computed at runtime by
# PqcInspectionGroupProvider (now removed):
#   * every group also contains the level-independent PQC inspections;
#   * PqcMinLevelN = all PQC-* algorithm-detection rules whose NIST compliance level is lower than N
#     (i.e. rules that do NOT satisfy the minimum NIST level N);
#   * AllPqcInspections = every PQC-* rule, regardless of NIST compliance level.
#
# Rule ids are generated from pqc-opengrep-rule-generator (opengrep-rules/java-kotlin).
# Include this file from a profile and enable/disable the desired group there.


groups:

  - groupId: PqcLevelIndependentInspections  # PQC inspections not tied to a NIST level
    inspections:
      - CryptoProviderSpecification
      - SslParametersModification
      - SslParametersNonDefaultConstructors
      - KotlinCryptoProviderSpecification
      - KotlinSslParametersModification
      - KotlinSslParametersNonDefaultConstructors

  - groupId: PqcNotCompliantRules  # NIST "not compliant" (level 0)
