      - "PqcMinLevel3"
      - "PqcLevel3Rules"

  - groupId: PqcMinLevel5  # rules below NIST level 5 (level 4 empty -> same as PqcMinLevel4)
    groups:
      - "PqcMinLevel4"

  - groupId: AllPqcInspections  # every PQC inspection, any level
    groups:
      - "PqcMinLevel5"
      - "PqcLevel5Rules"
